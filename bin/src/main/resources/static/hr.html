<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR / Company Dashboard - Online Job Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">JobPortal HR</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link text-white" id="userGreeting"></span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col d-flex justify-content-between align-items-center">
                <h2 class="fw-bold">My Posted Jobs</h2>
                <button class="btn btn-primary rounded-pill fw-bold" data-bs-toggle="modal" data-bs-target="#postJobModal">+ Post New Job</button>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="list-group shadow-sm" id="hrJobsList">
                    <!-- List of posted jobs -->
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body">
                        <h4 class="fw-bold mb-3" id="atsTitle">Applicant Tracking System (ATS)</h4>
                        <p class="text-muted" id="atsDesc">Select a job to view applicants.</p>
                        
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Applicant Name</th>
                                        <th>Match Score</th>
                                        <th>Skills</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="atsTableBody">
                                    <!-- Applicants will be populated here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Post Job Modal -->
    <div class="modal fade" id="postJobModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content border-0 shadow rounded-4">
          <div class="modal-header bg-dark text-white rounded-top-4">
            <h5 class="modal-title">Post a New Job</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-4">
            <form id="postJobForm">
              <div class="mb-3">
                <label for="jobTitle" class="form-label">Job Title</label>
                <input type="text" class="form-control" id="jobTitle" required>
              </div>
              <div class="mb-3">
                <label for="jobDesc" class="form-label">Job Description</label>
                <textarea class="form-control" id="jobDesc" rows="3" required></textarea>
              </div>
              <div class="mb-3">
                <label for="reqSkills" class="form-label">Required Skills (comma separated)</label>
                <input type="text" class="form-control" id="reqSkills" placeholder="e.g., Java, React, SQL" required>
              </div>
              <button type="submit" class="btn btn-dark w-100 mt-3 rounded-pill py-2">Post Job</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initHrDashboard();
        });
    </script>
</body>
</html>
